<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="ball1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4d4d"/>
      <stop offset="100%" style="stop-color:#ff8080"/>
    </linearGradient>
    <linearGradient id="ball2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd84d"/>
      <stop offset="100%" style="stop-color:#ffe080"/>
    </linearGradient>
    <linearGradient id="ball3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4d9fff"/>
      <stop offset="100%" style="stop-color:#80b3ff"/>
    </linearGradient>
  </defs>
  <!-- Three juggling balls in arc formation -->
  <circle cx="20" cy="50" r="16" fill="url(#ball1)"/>
  <circle cx="50" cy="22" r="16" fill="url(#ball2)"/>
  <circle cx="80" cy="50" r="16" fill="url(#ball3)"/>
  <!-- Arc path hints -->
  <path d="M 20 50 Q 35 15 50 22" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M 50 22 Q 65 15 80 50" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.3"/>
</svg>

